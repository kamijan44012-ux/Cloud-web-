# Builds the Flutter web version of Chicken Hunter: Space War and deploys it to
# GitHub Pages automatically on every push to the main development branch.
#
# Before the first run, enable Pages once in the repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The game's mobile-only plugins (AdMob, Play Billing) are auto-disabled on web
# via kIsWeb in lib/config/game_config.dart, so the web build is clean. Firebase
# and audio still work (fail-soft without config).
name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  workflow_dispatch: # allow manual runs from the Actions tab

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel superseded in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Flame 1.23+ uses the Flutter 3.27 Color API (withValues / Color.a),
          # so the SDK must be >= 3.27. Keep this pinned and in lockstep with the
          # flame version in pubspec.yaml.
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate web platform files
        # The repo doesn't commit generated web/ scaffolding; create it for the
        # exact Flutter version in use. Non-destructive to lib/ and android/.
        # `flutter create` also drops a default test/widget_test.dart referencing
        # a non-existent MyApp — remove it so it doesn't pollute analysis.
        run: |
          flutter create --platforms=web --project-name chicken_hunter_space_war .
          rm -f test/widget_test.dart

      - name: Inject Firebase config from secrets
        # Overwrites the stub firebase_options.dart with real values when the
        # GitHub secrets are present. Add these in:
        #   Repo → Settings → Secrets and variables → Actions → New secret
        # Required secrets: FIREBASE_API_KEY, FIREBASE_APP_ID,
        #   FIREBASE_MESSAGING_SENDER_ID, FIREBASE_PROJECT_ID,
        #   FIREBASE_AUTH_DOMAIN, FIREBASE_STORAGE_BUCKET
        env:
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FB_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          if [ -n "$FB_API_KEY" ] && [ -n "$FB_PROJECT_ID" ]; then
            python3 - <<PYEOF
          import os
          tmpl = """// Auto-generated by CI from GitHub Secrets. Do not edit.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show TargetPlatform, defaultTargetPlatform, kIsWeb;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) return web;
              if (defaultTargetPlatform == TargetPlatform.android) return android;
              throw UnsupportedError('Unsupported platform');
            }
            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '{API_KEY}',
              appId: '{APP_ID}',
              messagingSenderId: '{SENDER_ID}',
              projectId: '{PROJECT_ID}',
              authDomain: '{AUTH_DOMAIN}',
              storageBucket: '{STORAGE_BUCKET}',
            );
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '{API_KEY}',
              appId: '{APP_ID}',
              messagingSenderId: '{SENDER_ID}',
              projectId: '{PROJECT_ID}',
              storageBucket: '{STORAGE_BUCKET}',
            );
          }
          """
          content = (tmpl
            .replace('{API_KEY}', os.environ['FB_API_KEY'])
            .replace('{APP_ID}', os.environ['FB_APP_ID'])
            .replace('{SENDER_ID}', os.environ['FB_SENDER_ID'])
            .replace('{PROJECT_ID}', os.environ['FB_PROJECT_ID'])
            .replace('{AUTH_DOMAIN}', os.environ['FB_AUTH_DOMAIN'])
            .replace('{STORAGE_BUCKET}', os.environ['FB_STORAGE_BUCKET'])
          )
          with open('lib/firebase_options.dart', 'w') as f:
            f.write(content)
          print('Firebase options injected successfully.')
          PYEOF
          else
            echo "Firebase secrets not set — building with stub options (offline mode)."
          fi

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build web
        # base-href must match the GitHub Pages sub-path (/<repo-name>/).
        # canvaskit renderer gives the smoothest Canvas/particle performance.
        run: >
          flutter build web --release
          --web-renderer canvaskit
          --base-href "/${{ github.event.repository.name }}/"

      - name: Add SPA + Jekyll fixups
        # 404.html lets deep links work; .nojekyll stops Pages from hiding
        # files/folders that start with an underscore (Flutter emits some).
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
