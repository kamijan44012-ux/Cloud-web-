name: chicken_hunter_space_war
description: "Chicken Hunter: Space War - a fast-paced 2D space shooter built with Flutter + Flame."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.18.0
  flame_audio: ^2.10.2

  # State / DI
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Firebase (cloud save, auth, leaderboards, remote config, analytics)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  firebase_remote_config: ^5.1.3

  # Monetisation
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

  # Utils
  collection: ^1.18.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/ship/
    - assets/images/enemies/
    - assets/images/bullets/
    - assets/images/powerups/
    - assets/images/fx/
    - assets/images/bg/
    - assets/images/ui/
    - assets/audio/
    - assets/data/
